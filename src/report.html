<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>台灣網站流量總覽｜流量觀察</title>
<link rel="stylesheet" href="<!--style-->">
</head>
<body class="report-page">
<!--header-->
<main id="main" class="wrap report-main" tabindex="-1">
  <div class="report-heading">
    <div><p class="kicker">TAIWAN WEB TRAFFIC</p><h1>台灣網站流量</h1><p class="dek" id="dek">每月排行、流量趨勢，一目了然。</p></div>
    <label class="month-control">資料月份 <select id="to" disabled><option>載入中…</option></select></label>
  </div>
  <section class="overview" id="overview" aria-label="本期概況" aria-busy="true">
    <div><span>有資料的網站</span><strong>—</strong></div><div><span>每月造訪估算</span><strong>—</strong></div><div><span>與前期相比</span><strong>—</strong></div>
  </section>
  <section class="directory" aria-labelledby="directory-title">
    <div class="directory-heading"><div><h2 id="directory-title">網站排行</h2><p class="note">選擇網站，查看完整流量趨勢。</p></div><a id="full-data" class="text-link" href="/table/">完整數據 <span aria-hidden="true">↗</span></a></div>
    <div class="filter-toolbar">
      <label class="search-field"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input id="search" type="search" aria-label="搜尋網站名稱或網域" placeholder="搜尋網站名稱或網域" autocomplete="off" disabled><button id="clear-search" type="button" aria-label="清除搜尋" hidden>✕</button></label>
      <label class="topic-control"><span class="sr-only">網站分類</span><select id="topic" disabled><option>全部分類</option></select></label>
      <button id="reset" type="button" class="quiet" hidden>重設篩選</button>
    </div>
    <details class="filter-details" id="filters">
      <summary>篩選與比較 <span class="filter-summary" id="filter-summary"></span></summary>
      <div class="filter-content"><div class="controls">
        <label>比較月份 <select id="from" disabled></select></label><span class="presets" id="presets"></span>
        <label>追蹤來源 <select id="source" disabled><option value="">所有來源</option></select></label>
        <label class="check"><input id="foreign" type="checkbox" disabled>包含非台灣網站</label>
      </div><p class="range-note" id="rangeNote"></p></div>
    </details>
    <div class="results-bar"><p id="result-count" role="status" aria-live="polite">正在載入流量資料…</p><button type="button" id="detail-toggle" class="quiet" aria-pressed="false" disabled>更多指標</button></div>
    <div id="sections" aria-busy="true"><div class="loading-state"><span class="loading-dot"></span>正在整理網站排行…</div></div>
    <noscript><p class="empty">請開啟 JavaScript 使用搜尋，或直接查看<a href="/table/">完整數據</a>。</p></noscript>
  </section>
  <p class="data-stamp" id="generated"></p>
</main>
<!--footer-->
<div class="backdrop" id="backdrop"></div>
<aside class="panel" id="panel" aria-hidden="true" aria-modal="true" role="dialog" aria-label="網站詳情" inert></aside>
<div class="tip" id="tip" role="tooltip"></div>

<script>
'use strict';
const UNLABELLED = '未分類';
const PAGE_SIZE = 15;
const SPARK_MONTHS = 12;
const BUMP_MONTHS = 12;
// GeneHong's sheet is the hand-curated list, so its domains and the ones added on /watch/ are one source: 手動.
const SOURCE_LABEL = { tag: '媒體', blog: '部落格', manual: '手動追蹤' };
const SOURCE_OF = { sheet: 'manual' };
const state = { data: null, from: null, to: null, sort: {}, page: 0, query: '', detailed: false, selected: null, active: null, source: null, hl: null, bumpTop: 10, foreign: false };

// ---------- formatting ----------
const monthLabel = (m) => `${m.slice(0, 4)} 年 ${Number(m.slice(4))} 月`;
const monthShort = (m) => `${m.slice(2, 4)}/${m.slice(4)}`;
const nf = (n, d = 2) => (n == null ? '—' : n.toLocaleString('zh-TW', { minimumFractionDigits: d, maximumFractionDigits: d }));
const visits = (n) => (n == null ? '—' : n >= 100 ? nf(n, 1) : n >= 10 ? nf(n, 2) : nf(n, 3));
const pct = (n, d = 1) => (n == null ? '—' : `${(n * 100).toFixed(d)}%`);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
function deltaHtml(d) {
  if (d == null) return '<span class="delta na">—</span>';
  if (d === 'new') return '<span class="delta na" title="比較月份沒有這個網站的資料">無前期</span>';
  const cls = d > 0.0005 ? 'up' : d < -0.0005 ? 'down' : 'na';
  const arrow = cls === 'up' ? '▲' : cls === 'down' ? '▼' : '';
  return `<span class="delta ${cls}">${arrow}${Math.abs(d * 100).toFixed(1)}%</span>`;
}
function radarText(r) {
  if (!r) return '';
  if (r.rank != null) return `第 ${r.rank} 名`;
  if (r.bucket != null) return `前 ${r.bucket.toLocaleString('en-US')} 名`;
  if (r.gt != null) return `未入前 ${r.gt.toLocaleString('en-US')} 名`;
  return '';
}

// ---------- data helpers ----------
const V = 0, S = 1, A = 2, T = 3, SHEET = 4;
function calendar(first, last) {
  const out = [];
  let y = Number(first.slice(0, 4)), m = Number(first.slice(4));
  for (;;) {
    const key = `${y}${String(m).padStart(2, '0')}`;
    out.push(key);
    if (key === last) return out;
    if (++m > 12) { m = 1; y++; }
  }
}
const topicsOf = (s) => (s.topics?.length ? s.topics : [UNLABELLED]);
// Ranks count Taiwan sites only: the 「非台灣」 group is listed but unranked, so it
// doesn't push every local site down (same rule as /table/ and the rank trajectories).
const isTaiwan = (s) => s.group !== '非台灣';
const numberRanks = (rows) => { let n = 0; return rows.map((r) => ({ ...r, rank: isTaiwan(r) ? ++n : null })); };
const inSource = (s) => !state.source || (s.src || []).some((r) => (SOURCE_OF[r] ?? r) === state.source);
function row(domain, s) {
  const now = s.m[state.to];
  if (!now || now[V] == null) return null;
  const before = state.from === state.to ? null : s.m[state.from];
  const change = state.from === state.to ? null : before?.[V] ? now[V] / before[V] - 1 : before ? null : 'new';
  const radar = (state.data.radar[domain] || []).at(-1) || null;
  return {
    domain, name: s.name || domain, group: s.group, topics: topicsOf(s), visits: now[V], prev: before ? before[V] : null,
    change, search: now[S], ai: now[A], taiwan: now[T], sheet: !!now[SHEET], radar,
    radarSort: radar ? (radar.rank ?? radar.bucket ?? (radar.gt != null ? radar.gt * 10 : null)) : null,
  };
}
// 「非台灣」 sites are hidden until the reader turns on 「含非台灣」.
function rowsFor(topic) {
  const out = [];
  for (const [d, s] of Object.entries(state.data.sites)) {
    if (!inSource(s) || (!state.foreign && !isTaiwan(s))) continue;
    if (topic && !topicsOf(s).includes(topic)) continue;
    const r = row(d, s);
    if (r) out.push(r);
  }
  out.sort((a, b) => b.visits - a.visits);
  return numberRanks(out);
}
const sum = (xs) => xs.reduce((a, b) => a + (b || 0), 0);

// ---------- tooltip ----------
const tip = document.getElementById('tip');
function showTip(html, x, y) {
  tip.innerHTML = html;
  tip.classList.add('show');
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let left = x + 14, top = y - h - 10;
  if (left + w > innerWidth - 8) left = x - w - 14;
  if (top < 8) top = y + 16;
  tip.style.left = `${Math.max(8, left)}px`;
  tip.style.top = `${top}px`;
}
const hideTip = () => tip.classList.remove('show');

// ---------- line chart (sparkline and full) ----------
// points: [{key, value|null}] along calendar months; gaps break the line.
function lineChart(points, { width, height, pad = { t: 8, r: 8, b: 8, l: 8 }, axes = false, fmt = visits, tickFmt = null, band = null, mark = null, yMin0 = true, label = '' }) {
  const vals = points.map((p) => p.value).filter((v) => v != null);
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
  svg.setAttribute('class', axes ? 'chart' : 'spark');
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', label);
  if (!vals.length) return svg;
  let lo = yMin0 ? 0 : Math.min(...vals), hi = Math.max(...vals);
  if (hi === lo) hi = lo + (hi || 1);
  if (axes) {
    // nice upper bound
    const step = niceStep((hi - lo) / 4);
    hi = Math.ceil(hi / step) * step;
    if (!yMin0) lo = Math.floor(lo / step) * step;
  } else hi *= 1.04;
  const iw = width - pad.l - pad.r, ih = height - pad.t - pad.b;
  const x = (i) => pad.l + (points.length === 1 ? iw / 2 : (i / (points.length - 1)) * iw);
  const y = (v) => pad.t + ih - ((v - lo) / (hi - lo)) * ih;
  let html = '';
  if (band) {
    const i0 = points.findIndex((p) => p.key === band[0]), i1 = points.findIndex((p) => p.key === band[1]);
    if (i0 >= 0 && i1 >= 0) {
      const a = Math.min(i0, i1), b = Math.max(i0, i1);
      html += `<rect class="band" x="${x(a) - 3}" y="${pad.t}" width="${x(b) - x(a) + 6}" height="${ih}" rx="3"></rect>`;
    }
  }
  if (axes) {
    const step = niceStep((hi - lo) / 4);
    for (let v = lo; v <= hi + 1e-9; v += step) {
      html += `<line class="${v === lo ? 'baseline' : 'gridline'}" x1="${pad.l}" x2="${width - pad.r}" y1="${y(v)}" y2="${y(v)}"></line>`;
      html += `<text class="tick" x="${pad.l - 6}" y="${y(v) + 4}" text-anchor="end">${(tickFmt || axisNum(step))(v)}</text>`;
    }
    const every = Math.max(1, Math.ceil(points.length / 7));
    points.forEach((p, i) => {
      const last = i === points.length - 1;
      if ((i % every === 0 && (last || points.length - 1 - i >= every / 2 + 0.5)) || last)
        html += `<text class="tick" x="${x(i)}" y="${height - pad.b + 16}" text-anchor="middle">${monthShort(p.key)}</text>`;
    });
  }
  // segments split at gaps; mark gaps with a dotted connector so missing months read as missing
  let seg = [], lastIdx = null;
  const segs = [];
  points.forEach((p, i) => {
    if (p.value == null) { if (seg.length) segs.push(seg); seg = []; return; }
    if (lastIdx != null && i - lastIdx > 1 && axes)
      html += `<line class="gapmark" x1="${x(lastIdx)}" x2="${x(i)}" y1="${y(points[lastIdx].value)}" y2="${y(p.value)}"></line>`;
    seg.push([x(i), y(p.value)]);
    lastIdx = i;
  });
  if (seg.length) segs.push(seg);
  for (const s of segs) {
    if (s.length === 1) html += `<circle class="dot" cx="${s[0][0]}" cy="${s[0][1]}" r="${axes ? 3 : 2}"></circle>`;
    else html += `<path class="line" d="M${s.map((p) => p.map((n) => n.toFixed(1)).join(',')).join('L')}"></path>`;
  }
  const lastI = points.map((p) => p.value != null).lastIndexOf(true);
  if (lastI >= 0 && !axes) html += `<circle class="dot" cx="${x(lastI)}" cy="${y(points[lastI].value)}" r="2.5"></circle>`;
  // the comparison month as a hollow dot (sparklines)
  if (mark) {
    const mi = points.findIndex((p) => p.key === mark);
    if (mi >= 0 && points[mi].value != null) html += `<circle class="from" cx="${x(mi)}" cy="${y(points[mi].value)}" r="2.5"></circle>`;
  }
  html += `<line class="cross" x1="0" x2="0" y1="${pad.t}" y2="${pad.t + ih}" visibility="hidden"></line><circle class="dot hover" r="4" visibility="hidden"></circle>`;
  html += `<rect x="0" y="0" width="${width}" height="${height}" fill="transparent"></rect>`;
  svg.innerHTML = html;
  const cross = svg.querySelector('.cross'), hdot = svg.querySelector('.hover');
  const move = (ev) => {
    const r = svg.getBoundingClientRect();
    const px = ((ev.clientX - r.left) / r.width) * width;
    let i = Math.round(((px - pad.l) / iw) * (points.length - 1));
    i = Math.max(0, Math.min(points.length - 1, i));
    const p = points[i];
    cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.setAttribute('visibility', 'visible');
    if (p.value != null) { hdot.setAttribute('cx', x(i)); hdot.setAttribute('cy', y(p.value)); hdot.setAttribute('visibility', 'visible'); }
    else hdot.setAttribute('visibility', 'hidden');
    showTip(`<b>${monthLabel(p.key)}</b><br>${p.value == null ? '沒有資料' : `${label ? `${esc(label)} ` : ''}${fmt(p.value)}`}${p.extra ? `<br>${p.extra}` : ''}`, ev.clientX, ev.clientY);
  };
  const leave = () => { cross.setAttribute('visibility', 'hidden'); hdot.setAttribute('visibility', 'hidden'); hideTip(); };
  svg.addEventListener('pointermove', move);
  svg.addEventListener('pointerleave', leave);
  return svg;
}
/** Axis numbers with just enough decimals for the step. */
const axisNum = (step) => (v) => v.toLocaleString('zh-TW', { maximumFractionDigits: Math.max(0, -Math.floor(Math.log10(step))), minimumFractionDigits: 0 });
const axisPct = (step) => (v) => `${(v * 100).toLocaleString('zh-TW', { maximumFractionDigits: Math.max(0, -Math.floor(Math.log10(step * 100))) })}%`;
function niceStep(raw) {
  if (raw <= 0) return 1;
  const p = 10 ** Math.floor(Math.log10(raw));
  const f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}

// ---------- header controls ----------
function fillSelects() {
  const months = state.data.months;
  const opts = (sel) => [...months].reverse().map((m) => `<option value="${m}"${m === sel ? ' selected' : ''}>${monthLabel(m)}</option>`).join('');
  document.getElementById('to').innerHTML = opts(state.to);
  document.getElementById('from').innerHTML = [...months].reverse().filter((m) => m < state.to).map((m) => `<option value="${m}"${m === state.from ? ' selected' : ''}>${monthLabel(m)}</option>`).join('');
  const fromSelect = document.getElementById('from');
  fromSelect.disabled = state.from === state.to;
  if (state.from === state.to) fromSelect.innerHTML = '<option>無更早月份</option>';
  const prevYear = `${Number(state.to.slice(0, 4)) - 1}${state.to.slice(4)}`;
  const idx = months.indexOf(state.to);
  const presets = [
    ['上個月', months[idx - 1]],
    ['3 個月前', months[idx - 3]],
    ['6 個月前', months[idx - 6]],
    ['去年同月', months.includes(prevYear) ? prevYear : null],
  ].filter(([, m]) => m);
  document.getElementById('presets').innerHTML = presets.map(([l, m]) => `<button type="button" data-from="${m}" aria-pressed="${m === state.from}">${l}</button>`).join('');
}
function readHash() {
  // The hash wins; ?month=&topic=&source= (links from /topics/ and old URLs) is the fallback.
  const q = new URLSearchParams(location.hash.slice(1));
  const search = new URLSearchParams(location.search);
  if (!q.has('to') && search.has('month')) q.set('to', search.get('month'));
  for (const k of ['topic', 'source']) if (!q.has(k) && search.has(k)) q.set(k, search.get(k));
  const months = state.data.months;
  state.to = months.includes(q.get('to')) ? q.get('to') : months.at(-1);
  const i = months.indexOf(state.to);
  state.from = months.includes(q.get('from')) && q.get('from') < state.to ? q.get('from') : months[i - 1] ?? months[0];
  state.active = q.get('topic');
  const wanted = SOURCE_OF[q.get('source')] ?? q.get('source');
  state.source = state.data.sources.some((o) => o.source === wanted) ? wanted : null;
  state.hl = q.get('hl');
  state.bumpTop = q.get('top') === '20' ? 20 : 10;
  state.foreign = (q.get('foreign') ?? search.get('foreign')) === '1';
  state.query = q.get('q') || '';
  state.detailed = q.get('details') === '1';
  const requestedPage = Number(q.get('page'));
  state.page = Number.isFinite(requestedPage) ? Math.max(0, Math.floor(requestedPage) - 1) : 0;
  const sortColumn = COLS.find((c) => c.sort && c.key === q.get('sort') && (state.detailed || !c.detail));
  state.sort = { [state.active ?? '__all']: sortColumn ? { key: sortColumn.key, dir: q.get('order') === 'asc' ? 1 : q.get('order') === 'desc' ? -1 : sortColumn.dir } : { key: 'rank', dir: 1 } };
  document.getElementById('search').value = state.query;
}
function writeHash() {
  const q = new URLSearchParams({ to: state.to, from: state.from });
  if (state.active) q.set('topic', state.active);
  if (state.source) q.set('source', state.source);
  if (state.hl) q.set('hl', state.hl);
  if (state.bumpTop !== 10) q.set('top', String(state.bumpTop));
  if (state.foreign) q.set('foreign', '1');
  if (state.query) q.set('q', state.query);
  if (state.detailed) q.set('details', '1');
  if (state.page) q.set('page', String(state.page + 1));
  const sort = currentSort();
  if (sort.key !== 'rank' || sort.dir !== 1) { q.set('sort', sort.key); q.set('order', sort.dir === 1 ? 'asc' : 'desc'); }
  if (state.selected) q.set('site', state.selected);
  history.replaceState(null, '', `${location.pathname}#${q}`);
}

// ---------- page ----------
function render() {
  fillSelects();
  const all = rowsFor(null);
  const counts = new Map();
  for (const r of all) for (const t of r.topics) counts.set(t, (counts.get(t) || 0) + 1);
  const topics = [...counts.keys()].sort((a, b) => (a === UNLABELLED) - (b === UNLABELLED) || counts.get(b) - counts.get(a));
  if (state.active && !counts.has(state.active)) state.active = null;
  document.getElementById('topic').innerHTML = '<option value="">全部分類</option>' + topics.map((t) => `<option value="${esc(t)}"${t === state.active ? ' selected' : ''}>${esc(t)} · ${counts.get(t)}</option>`).join('');
  document.getElementById('source').innerHTML = '<option value="">所有來源</option>' + state.data.sources.map((o) => `<option value="${esc(o.source)}"${o.source === state.source ? ' selected' : ''}>${esc(SOURCE_LABEL[o.source] ?? o.source)}</option>`).join('');
  document.getElementById('foreign').checked = state.foreign;
  const scoped = state.active ? numberRanks(all.filter((r) => r.topics.includes(state.active))) : all;
  const total = sum(scoped.map((r) => r.visits));
  const both = scoped.filter((r) => r.prev != null);
  const before = sum(both.map((r) => r.prev));
  const change = before && state.from !== state.to ? sum(both.map((r) => r.visits)) / before - 1 : null;
  document.getElementById('overview').innerHTML = `<div><span>${state.active ? esc(state.active) : '本期'}網站</span><strong>${scoped.length.toLocaleString('zh-TW')}<small>個</small></strong><p>目前範圍內有流量資料</p></div>
<div><span>每月造訪估算</span><strong>${visits(total)}<small>百萬次</small></strong><p>${monthLabel(state.to)} · Similarweb／試算表</p></div>
<div><span>與 ${monthShort(state.from)} 相比</span><strong>${deltaHtml(change)}</strong><p>${state.from === state.to ? '尚無更早月份可比較' : `以兩期都有資料的 ${both.length} 個網站計算`}</p></div>`;
  document.getElementById('overview').setAttribute('aria-busy', 'false');
  document.getElementById('rangeNote').textContent = `比較 ${monthLabel(state.from)} → ${monthLabel(state.to)}。造訪量單位為百萬次；非台灣群組不列入名次。`;
  document.getElementById('filter-summary').textContent = `${SOURCE_LABEL[state.source] || '所有來源'} · ${state.foreign ? '含非台灣' : '不含非台灣群組'}`;
  document.getElementById('clear-search').hidden = !state.query;
  document.getElementById('reset').hidden = !state.active && !state.source && !state.query && !state.foreign;
  document.getElementById('detail-toggle').setAttribute('aria-pressed', String(state.detailed));
  document.getElementById('detail-toggle').textContent = state.detailed ? '收起額外指標' : '更多指標';
  const q = new URLSearchParams({ month: state.to });
  if (state.active) q.set('topic', state.active);
  if (state.source) q.set('source', state.source);
  if (state.foreign) q.set('foreign', '1');
  document.getElementById('full-data').href = `/table/?${q}`;
  renderResults(scoped);
}

const COLS = [
  { key: 'rank', label: '排名', cls: 'rank', sort: (r) => -r.visits, dir: 1 },
  { key: 'name', label: '網站', cls: 'l name-cell' },
  { key: 'visits', label: '造訪量', cls: 'num traffic-cell', sort: (r) => r.visits, dir: -1, title: '每月造訪估算，單位為百萬次' },
  { key: 'change', label: '變化', cls: 'num change-cell', sort: (r) => (typeof r.change === 'number' ? r.change : null), dir: -1, title: '與所選比較月份相比' },
  { key: 'spark', label: '近一年趨勢', cls: 'l spark-cell' },
  { key: 'search', label: '自然搜尋', cls: 'num', sort: (r) => r.search, dir: -1, title: '自然搜尋帶來的造訪（百萬）', detail: true },
  { key: 'ai', label: 'AI 導流', cls: 'num', sort: (r) => r.ai, dir: -1, title: 'GenAI 導流造訪（百萬）', detail: true },
  { key: 'taiwan', label: '台灣占比', cls: 'num', sort: (r) => r.taiwan, dir: -1, detail: true },
  { key: 'radar', label: 'Radar 全球', cls: 'l radar', sort: (r) => r.radarSort, dir: 1, title: 'Cloudflare Radar 最新一期', detail: true },
];
function currentSort() {
  const sort = state.sort[state.active ?? '__all'];
  return sort && COLS.some((c) => c.sort && c.key === sort.key && (state.detailed || !c.detail)) ? sort : { key: 'rank', dir: 1 };
}
function renderResults(scoped = rowsFor(state.active)) {
  const query = state.query.trim().toLocaleLowerCase();
  const rows = scoped.filter((r) => !query || `${r.name} ${r.domain}`.toLocaleLowerCase().includes(query));
  document.getElementById('result-count').textContent = `${state.active || '全部網站'} · ${rows.length.toLocaleString('zh-TW')} 個${query ? '搜尋結果' : '網站'} · 造訪量單位：百萬次`;

function section(topic, rows) {

  el.className = `ranking-section${state.detailed ? ' detailed' : ''}`;
  el.setAttribute('aria-label', `${topic || '全部網站'}排行`);
  el.innerHTML = '<div class="scroll"><table class="ranking-table"><thead><tr></tr></thead><tbody></tbody></table></div><div class="pagination"></div>';
  const cols = COLS.filter((c) => state.detailed || !c.detail);
  const sort = currentSort();
  const col = cols.find((c) => c.key === sort.key);

    const va = col.sort(a), vb = col.sort(b);
    if (va == null && vb == null) return b.visits - a.visits;

  }).join('');
  el.querySelectorAll('[data-sort]').forEach((button) => { button.addEventListener('click', () => {
    const c = COLS.find((x) => x.key === button.dataset.sort);
    state.sort[id] = { key: c.key, dir: sort.key === c.key ? -sort.dir : c.dir };
    state.page = 0;
    renderResults();
    document.querySelector(`[data-sort="${c.key}"]`).focus({ preventScroll: true });
  }); });
  const pages = Math.max(1, Math.ceil(sorted.length / PAGE_SIZE));
  state.page = Math.min(state.page, pages - 1);
  const start = state.page * PAGE_SIZE;
  const tbody = el.querySelector('tbody');
  const cal = calendar(state.data.months[0], state.to).slice(-SPARK_MONTHS);
  for (const r of sorted.slice(start, start + PAGE_SIZE)) {
    const tr = document.createElement('tr');
    tr.dataset.site = r.domain;
    if (r.domain === state.selected) tr.className = 'sel';
    else if (r.domain === state.hl) tr.className = 'hl';
    const cells = {
      rank: r.rank ?? '—',
      name: `<button type="button" class="site-name" data-open="${esc(r.domain)}">${esc(r.name)}</button>${r.sheet ? '<span class="tag" title="此月使用試算表數字">表</span>' : ''}${r.rank == null ? '<span class="tag">非台灣</span>' : ''}<span class="site-domain">${esc(r.domain)}</span>`,
      visits: visits(r.visits), change: deltaHtml(r.change), spark: '', search: visits(r.search), ai: visits(r.ai), taiwan: pct(r.taiwan), radar: radarText(r.radar) || '—',
    };
    tr.innerHTML = cols.map((c) => `<td class="${c.cls}">${cells[c.key]}</td>`).join('');
    const pts = cal.map((k) => ({ key: k, value: state.data.sites[r.domain].m[k]?.[V] ?? null }));
    tr.querySelector('.spark-cell').append(lineChart(pts, { width: 120, height: 30, pad: { t: 4, r: 4, b: 4, l: 4 }, mark: state.from, label: '造訪（百萬）' }));
    tbody.append(tr);
  }
  if (!rows.length) tbody.innerHTML = `<tr><td colspan="${cols.length}" class="empty"><strong>${state.query ? '找不到符合的網站' : '這個範圍暫無資料'}</strong><p>${state.query ? '試試其他名稱或網域，或重設篩選條件。' : '請選擇其他月份或來源。'}</p></td></tr>`;
  const pagination = el.querySelector('.pagination');
  if (rows.length) pagination.innerHTML = `<span>顯示 ${start + 1}–${Math.min(start + PAGE_SIZE, rows.length)}，共 ${rows.length} 個</span><div><button type="button" data-page="prev"${state.page === 0 ? ' disabled' : ''} aria-label="上一頁">←</button><span>第 ${state.page + 1} / ${pages} 頁</span><button type="button" data-page="next"${state.page === pages - 1 ? ' disabled' : ''} aria-label="下一頁">→</button></div>`;
  pagination.querySelectorAll('[data-page]').forEach((button) => { button.addEventListener('click', () => {
    state.page += button.dataset.page === 'next' ? 1 : -1;
    renderResults();
    document.getElementById('result-count').scrollIntoView({ block: 'start', behavior: 'instant' });
    const next = document.querySelector(`[data-page="${button.dataset.page}"]:not(:disabled)`) || document.querySelector('[data-page]:not(:disabled)');
    next?.focus({ preventScroll: true });
  }); });
  if (topic) {
    const details = document.createElement('details');
    details.className = 'disclosure trajectory';
    details.innerHTML = `<summary>查看${esc(topic)}的排名變化<span>近一年</span></summary><div class="bump" data-topic="${esc(topic)}"></div>`;
    details.addEventListener('toggle', () => { if (details.open) drawBump(details.querySelector('.bump'), topic); });
    el.append(details);
  }
  return el;
}

// ---------- rank trajectory (排名軌跡) ----------
// Sites of one topic ranked against each other month by month (Taiwan sites only,
// like the tables). Gray lines are the top 10/20 in the latest month; the
// highlighted site (click a line or a table row) is blue.
const topicRankCache = new Map();
function topicRanks(topic, month) {
  const key = `${state.source}|${topic}|${month}`;
  if (!topicRankCache.has(key)) {
    const list = Object.entries(state.data.sites)
      .filter(([, s]) => inSource(s) && isTaiwan(s) && topicsOf(s).includes(topic) && s.m[month]?.[V] != null)
      .sort((a, b) => b[1].m[month][V] - a[1].m[month][V]);
    topicRankCache.set(key, new Map(list.map(([d], i) => [d, i + 1])));
  }
  return topicRankCache.get(key);
}
function bumpMonths() {
  const all = calendar(state.data.months[0], state.to);
  const fromIdx = all.indexOf(state.from);
  const start = Math.max(0, Math.min(all.length - BUMP_MONTHS, fromIdx < 0 ? 0 : fromIdx));
  return all.slice(start);
}
function setHighlight(domain) {
  state.hl = domain;
  document.querySelectorAll('tbody tr[data-site]').forEach((tr) => { tr.classList.toggle('hl', tr.dataset.site === domain && !tr.classList.contains('sel')); });
  drawBumps();
  writeHash();
}
function spreadLabels(ends, gap, lo, hi) {
  for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < gap) ends[i].y = ends[i - 1].y + gap;
  const over = ends.length ? ends.at(-1).y - hi : 0;
  if (over > 0) for (const e of ends) e.y -= over;
  for (let i = 0; i < ends.length; i++) if (ends[i].y < lo + i * gap) ends[i].y = lo + i * gap;
}
function drawBumps() {
  topicRankCache.clear();
  document.querySelectorAll('.disclosure[open] .bump[data-topic]').forEach((host) => { drawBump(host, host.dataset.topic); });
}
function drawBump(host, topic) {
  const months = bumpMonths();
  const N = state.bumpTop;
  const last = months.at(-1);
  const shown = [...topicRanks(topic, last)].slice(0, N).map(([d]) => d);
  const hl = state.hl && state.data.sites[state.hl] && topicsOf(state.data.sites[state.hl]).includes(topic) ? state.hl : null;
  if (hl && !shown.includes(hl)) shown.push(hl);
  const head = `<div class="bar"><h3>排名軌跡</h3><span>${esc(topic)}・${monthShort(months[0])}–${monthShort(last)}</span>
<span class="seg" role="group" aria-label="顯示幾名"><button type="button" data-top="10" aria-pressed="${N === 10}">前 10</button><button type="button" data-top="20" aria-pressed="${N === 20}">前 20</button></span></div>`;
  const note = `<p class="note">同一分類的台灣網站依當月流量排名（不含「非台灣」群組${state.source ? `；只算${esc(SOURCE_LABEL[state.source] ?? state.source)}追蹤的網域` : ''}）。灰線是 ${monthShort(last)} 的前 ${N} 名，藍線是選取的網站（點線或下方表格列）。斷開處是沒有資料的月份，不補線。</p>`;
  if (!shown.length) { host.innerHTML = `${head}<p class="empty">這個分類在期間內沒有資料。</p>`; return; }
  const width = Math.max(300, host.clientWidth || document.getElementById('sections').clientWidth);
  const narrow = width < 520;
  const labelW = Math.min(150, width * (narrow ? 0.34 : 0.22));
  const LIMIT = N + 2;
  const rowH = narrow ? (N > 10 ? 13 : 17) : N > 10 ? 16 : 21;
  const m = { l: 30, r: labelW + 10, t: 10, b: 26 };
  const height = m.t + m.b + rowH * (LIMIT + 0.6);
  const iw = width - m.l - m.r;
  const sx = (i) => m.l + (months.length === 1 ? iw / 2 : (i / (months.length - 1)) * iw);
  const sy = (r) => m.t + (Math.min(r, LIMIT + 0.6) - 1) * rowH + rowH / 2;
  let g = '';
  for (const r of [1, 5, 10, 15, 20].filter((r) => r <= N)) g += `<line x1="${m.l}" x2="${width - m.r}" y1="${sy(r)}" y2="${sy(r)}" stroke="var(--grid)"/><text class="tick" x="${m.l - 8}" y="${sy(r) + 4}" text-anchor="end">${r}</text>`;
  g += `<text class="tick" x="${m.l - 8}" y="${sy(LIMIT + 0.6) + 4}" text-anchor="end">${N}+</text>`;
  const every = Math.max(1, Math.ceil(months.length / (narrow ? 4 : 7)));
  months.forEach((mo, i) => {
    if (i % every === 0 || i === months.length - 1)
      if (i === months.length - 1 || months.length - 1 - i >= every / 2) g += `<text class="tick" x="${sx(i)}" y="${height - 8}" text-anchor="middle">${monthShort(mo)}</text>`;
  });
  const lines = shown.map((d) => ({
    d,
    pts: months.map((mo, i) => {
      const r = topicRanks(topic, mo).get(d);
      return { mo, i, x: sx(i), y: r == null ? null : sy(r), r };
    }),
  }));
  const seg = (pts) => {
    let d = '', open = false;
    for (const p of pts) {
      if (p.y == null) { open = false; continue; }
      d += `${open ? 'L' : 'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`;
      open = true;
    }
    return d;
  };
  for (const L of [...lines].sort((a, b) => (a.d === hl) - (b.d === hl))) {
    g += `<g class="bl${L.d === hl ? ' on' : ''}" data-d="${esc(L.d)}"><path d="${seg(L.pts)}"/>`;
    for (const p of L.pts) if (p.y != null) g += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${L.d === hl ? 4 : 3}"/>`;
    g += '</g>';
  }
  const ends = lines
    .map((L) => { const p = [...L.pts].reverse().find((q) => q.y != null); return p && { d: L.d, y: p.y, r: p.r, i: p.i }; })
    .filter(Boolean)
    .sort((a, b) => a.y - b.y);
  spreadLabels(ends, narrow ? 11 : 13, m.t + 4, height - m.b - 2);
  const maxChars = Math.max(3, Math.floor((labelW - 26) / 12));
  for (const e of ends) {
    const name = state.data.sites[e.d].name || e.d;
    const short = name.length > maxChars ? `${name.slice(0, maxChars - 1)}…` : name;
    g += `<text class="end${e.d === hl ? ' on' : ''}" x="${width - m.r + 8}" y="${(e.y + 4).toFixed(1)}">${e.i === months.length - 1 ? e.r : '·'} ${esc(short)}</text>`;
  }
  g += `<rect class="hit" x="${m.l - 10}" y="0" width="${iw + 20}" height="${height}" fill="transparent"/>`;
  host.innerHTML = `${head}<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${esc(topic)}分類內名次軌跡">${g}</svg>${note}`;
  const svg = host.querySelector('svg');
  const nearest = (ev) => {
    const r = svg.getBoundingClientRect();
    const px = ((ev.clientX - r.left) / r.width) * width, py = ((ev.clientY - r.top) / r.height) * height;
    let i = Math.round(((px - m.l) / iw) * (months.length - 1));
    i = Math.max(0, Math.min(months.length - 1, i));
    let best = null, dist = Infinity;
    for (const L of lines) { const q = L.pts[i]; if (q.y != null && Math.abs(q.y - py) < dist) { dist = Math.abs(q.y - py); best = { L, q }; } }
    return dist <= rowH * 1.5 ? best : null;
  };
  const move = (ev) => {
    const b = nearest(ev);
    for (const el of svg.querySelectorAll('.bl')) {
      const mine = !!b && el.dataset.d === b.L.d;
      el.classList.toggle('hov', mine);
      // The selected site stays fully drawn while another line is hovered.
      el.classList.toggle('dim', !!b && !mine && !el.classList.contains('on'));
      if (mine) el.parentNode.append(el);
    }
    if (!b) { hideTip(); return; }
    const s = state.data.sites[b.L.d];
    const v = s.m[b.q.mo]?.[V];
    showTip(`<b>${esc(s.name || b.L.d)}</b><br>${monthLabel(b.q.mo)}：分類內第 ${b.q.r} 名<br>造訪 ${visits(v)} 百萬${s.m[b.q.mo]?.[SHEET] ? '（試算表）' : ''}`, ev.clientX, ev.clientY);
  };
  svg.addEventListener('pointermove', move);
  svg.addEventListener('pointerdown', move);
  svg.addEventListener('pointerleave', () => {
    for (const el of svg.querySelectorAll('.bl')) el.classList.remove('dim', 'hov');
    hideTip();
  });
  svg.addEventListener('click', (ev) => {
    const b = nearest(ev);
    if (b) setHighlight(b.L.d === state.hl ? null : b.L.d);
  });
}
let resizeTimer;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(drawBumps, 150); });

// ---------- events ----------
document.addEventListener('click', (ev) => {
  if (ev.target.closest('.skip-link')) { ev.preventDefault(); document.getElementById('main').focus(); return; }
  const preset = ev.target.closest('#presets button');
  if (preset) { state.from = preset.dataset.from; state.page = 0; render(); return; }
  const top = ev.target.closest('.bump [data-top]');
  if (top) { state.bumpTop = Number(top.dataset.top); drawBumps(); writeHash(); return; }
  const tr = ev.target.closest('tbody tr[data-site]');
  if (tr && !panel.contains(tr)) { setHighlight(tr.dataset.site); openPanel(tr.dataset.site); }
});
backdrop.addEventListener('click', closePanel);
addEventListener('keydown', (ev) => {
  if (!state.selected) return;
  if (ev.key === 'Escape') closePanel();
  if (ev.key === 'Tab') {
    const focusable = [...panel.querySelectorAll('button, a[href], summary, input, select, [tabindex="0"]')].filter((el) => el.getClientRects().length && !el.disabled);
    const first = focusable[0], last = focusable.at(-1);
    if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
  }
});
document.getElementById('to').addEventListener('change', (ev) => {

  if (state.from >= state.to) state.from = months[months.indexOf(state.to) - 1] ?? months[0];
  state.page = 0;

});
for (const [id, key] of [['from', 'from'], ['topic', 'active'], ['source', 'source']]) {

}
document.getElementById('foreign').addEventListener('change', (ev) => { state.foreign = ev.target.checked; state.page = 0; render(); });

document.getElementById('clear-search').addEventListener('click', () => { state.query = ''; state.page = 0; document.getElementById('search').value = ''; render(); document.getElementById('search').focus(); });
document.getElementById('reset').addEventListener('click', () => { state.query = ''; state.active = null; state.source = null; state.foreign = false; state.page = 0; document.getElementById('search').value = ''; render(); document.getElementById('search').focus(); });
document.getElementById('detail-toggle').addEventListener('click', () => { state.detailed = !state.detailed; render(); });
addEventListener('hashchange', () => {
  if (!state.data?.months.length) return;
  const selected = new URLSearchParams(location.hash.slice(1)).get('site');
  if (state.selected) closePanel(false);
  readHash(); render();
  if (selected) openPanel(selected);
});
async function loadData() {
  try {
    const response = await fetch('/api/v1/history');
    if (!response.ok) throw Error('無法取得資料');
    const data = await response.json();
    if (!Array.isArray(data.months)) throw Error('資料格式不正確');
    state.data = data;
    if (!data.months.length) {
      document.getElementById('result-count').textContent = '尚無月份資料';
      document.getElementById('sections').innerHTML = '<div class="empty"><strong>還沒有流量資料</strong><p>資料更新後，網站排行會顯示在這裡。</p><a href="/status/">查看更新狀態</a></div>';
      document.getElementById('to').innerHTML = '<option>尚無資料</option>';
    } else {
      const selected = new URLSearchParams(location.hash.slice(1)).get('site');
      readHash(); render();
      document.querySelectorAll('.report-main input, .report-main select, #detail-toggle').forEach((el) => { el.disabled = false; });
      if (state.from === state.to) document.getElementById('from').disabled = true;
      if (selected) openPanel(selected);
    }
    document.getElementById('overview').setAttribute('aria-busy', 'false');
    document.getElementById('sections').setAttribute('aria-busy', 'false');
    document.getElementById('generated').textContent = `資料更新 ${new Date(data.generatedAt).toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', hour12: false, dateStyle: 'short', timeStyle: 'short' })} · 台北時間`;
  } catch {
    document.getElementById('overview').setAttribute('aria-busy', 'false');
    document.getElementById('sections').setAttribute('aria-busy', 'false');
    document.getElementById('result-count').textContent = '資料暫時無法載入';
    document.getElementById('sections').innerHTML = '<div class="empty"><strong>暫時無法取得流量資料</strong><p>請稍後重試，或先查看<a href="/table/">完整數據</a>。</p><button id="retry" type="button">重新載入</button></div>';
    document.getElementById('retry').addEventListener('click', () => { document.getElementById('retry').disabled = true; loadData(); });
  }
}
loadData();
</script>
</body>
</html>
