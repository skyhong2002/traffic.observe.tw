<!doctype html>
<html lang="zh-Hant-TW">
<head>

<body class="report-page">
<!--header-->
<main id="main" class="wrap report-main" tabindex="-1">
  <!--tabs-->
  <div class="page-head">
    <div><h1>網站流量排行</h1><p class="dek">每月 Similarweb 造訪估算，依流量排名，可與任一月份比較<span class="sep" aria-hidden="true">·</span><!--method--></p></div>
    <div class="page-actions"><a id="csv" href="/api/v1/rankings.csv">下載 CSV</a></div>
  </div>
  <section class="stats" id="overview" aria-label="本期概況" aria-busy="true">
    <div><span>有資料的網站</span><b>—</b></div><div><span>每月造訪估算</span><b>—</b></div><div><span>與前期相比</span><b>—</b></div>
  </section>
  <div class="toolbar">
    <label class="search-field"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input id="search" type="search" aria-label="搜尋網站名稱或網域" placeholder="搜尋網站名稱或網域" autocomplete="off" disabled><button id="clear-search" type="button" aria-label="清除搜尋" hidden>✕</button></label>
    <label class="select-field"><span>月份</span><select id="to" disabled><option>載入中…</option></select></label>

    <div id="sections" aria-busy="true"><div class="loading-state"><span class="loading-dot"></span>正在整理網站排行…</div></div>
    <noscript><p class="empty">請開啟 JavaScript 使用搜尋，或直接查看<a href="/table/">完整數據</a>。</p></noscript>
  </section>
  <p class="data-stamp" id="generated"></p>

<script>
'use strict';
const PAGE_SIZE = 50;
const SPARK_MONTHS = 12;
const BUMP_MONTHS = 12;
// GeneHong's sheet is the hand-curated list, so its domains and the ones added on /watch/ are one source: 手動.
const SOURCE_LABEL = { tag: '媒體', blog: '部落格', manual: '手動追蹤' };
const SOURCE_OF = { sheet: 'manual' };
const state = { data: null, from: null, to: null, sort: {}, limit: PAGE_SIZE, endless: false, query: '', active: [], exclude: [], source: null, hl: null, bumpTop: 10 };

// ---------- formatting ----------
const monthLabel = (m) => `${m.slice(0, 4)} 年 ${Number(m.slice(4))} 月`;
const monthShort = (m) => `${m.slice(2, 4)}/${m.slice(4)}`;
// Visits (stored in millions) at four significant digits, as on the server pages:
// a whole number under a thousand, then k, m below ten billion and b (437, 12.34k, 757.3m, 4031m, 12.34b).
function visitParts(millions) {
  const n = millions * 1e6;
  const [v, unit] = n >= 1e10 ? [n / 1e9, 'b'] : n >= 1e6 ? [millions, 'm'] : n >= 1e3 ? [n / 1e3, 'k'] : [n, ''];
  if (!unit) return [String(Math.round(v)), ''];
  const r = Number(v.toPrecision(4));
  return [r.toFixed(r >= 1000 ? 0 : 3 - Math.floor(Math.log10(r))), unit];
}
const visits = (n) => (n == null ? '—' : visitParts(n).join(''));
const pct = (n, d = 1) => (n == null ? '—' : `${(n * 100).toFixed(d)}%`);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
function deltaHtml(d) {
  if (d == null) return '<span class="delta na">—</span>';
  if (d === 'new') return '<span class="delta na" title="比較月份沒有這個網站的資料">無前期</span>';
  const cls = d > 0.0005 ? 'up' : d < -0.0005 ? 'down' : 'na';
  const arrow = cls === 'up' ? '+' : cls === 'down' ? '−' : '';
  return `<span class="delta ${cls}">${arrow}${Math.abs(d * 100).toFixed(1)}%</span>`;
}
function radarText(r) {
  if (!r) return '';
  if (r.rank != null) return `第 ${r.rank} 名`;
  if (r.bucket != null) return `前 ${r.bucket.toLocaleString('en-US')} 名`;
  if (r.gt != null) return `未入前 ${r.gt.toLocaleString('en-US')} 名`;
  return '';
}

// ---------- data helpers ----------
// Per month: visits, search, AI, Taiwan share, and where the visits came from.
const V = 0, S = 1, A = 2, T = 3, ORIGIN = 4, USED = 5, BASIS = 6, CAPPED = 8;
/** How the Taiwan share in use was found (BASIS): not measured by Similarweb, so shown with ≈ or <. */
const BASIS_NOTE = { 1: '編輯者在試算表以 1/N 估算的台灣占比', 2: '沿用這個網站較早月份的台灣占比', 3: 'Similarweb 前 5 大國家沒有台灣：台灣占比不會超過第 5 名，也不會超過 100% 減前 5 名，這是上限' };
const ORIGIN_NOTE = { 1: '試算表', 2: 'Similarweb 平台補登' };
function calendar(first, last) {
  const out = [];
  let y = Number(first.slice(0, 4)), m = Number(first.slice(4));
  for (;;) {
    const key = `${y}${String(m).padStart(2, '0')}`;
    out.push(key);
    if (key === last) return out;
    if (++m > 12) { m = 1; y++; }
  }
}
const tagHref = (topic) => {
  const q = new URLSearchParams({ topic, to: state.to, from: state.from });
  q.set('exclude', state.exclude.filter((t) => t !== topic).join(','));
  if (state.source) q.set('source', state.source);
  return '#' + esc(q.toString());
};
const topicsOf = (s) => s.topics || [];
const siteHref = (domain) => `/site/${encodeURIComponent(domain)}/`;
/** The site's icon (/icon/, cached on the server), or the first letter of its name where it has none. */
const favicon = (domain, name) =>
  `<span class="favicon" data-letter="${esc([...name.trim()][0]?.toUpperCase() ?? '')}" aria-hidden="true"><img src="/icon/${encodeURIComponent(domain)}" alt="" width="16" height="16" loading="lazy" onerror="this.remove()"></span>`;
// Every matching site participates in the same ranking.
const numberRanks = (rows) => rows.map((r, i) => ({ ...r, rank: i + 1 }));
const inSource = (s) => !state.source || (s.src || []).some((r) => (SOURCE_OF[r] ?? r) === state.source);
/** 台灣造訪量: visits × Taiwan share, null without a share. */
const twShare = (m) => (m ? m[USED] ?? m[T] : null);
const twVisits = (m) => (m && m[V] != null && twShare(m) != null ? m[V] * twShare(m) : null);
/** Larger 台灣造訪量 first; sites without a Taiwan share follow, among themselves by visits. */
const byTaiwan = (a, b) => (a.tw != null && b.tw != null && a.tw !== b.tw ? b.tw - a.tw : (a.tw == null) !== (b.tw == null) ? (a.tw == null ? 1 : -1) : (b.visits ?? 0) - (a.visits ?? 0));
const byRow = (a, b) => byTaiwan({ tw: a.twVisits, visits: a.visits }, { tw: b.twVisits, visits: b.visits });
function row(domain, s) {
  const now = s.m[state.to];
  if (!now || now[V] == null) return null;
  const before = state.from === state.to ? null : s.m[state.from];
  const change = state.from === state.to ? null : before?.[V] ? now[V] / before[V] - 1 : before ? null : 'new';
  const radar = (state.data.radar[domain] || []).at(-1) || null;
  return {
    domain, name: s.name || domain, group: s.group, topics: topicsOf(s), visits: now[V], twVisits: twVisits(now), twBasis: now[BASIS] || 0, twShare: twShare(now), twCapped: now[CAPPED] === 1, prev: before ? before[V] : null,
    change, search: now[S], ai: now[A], taiwan: now[T], origin: now[ORIGIN], radar,
    radarSort: radar ? (radar.rank ?? radar.bucket ?? (radar.gt != null ? radar.gt * 10 : null)) : null,
  };
}
function rowsFor(topic) {
  const out = [];
  for (const [d, s] of Object.entries(state.data.sites)) {
    if (!inSource(s)) continue;
    if (topic && !topicsOf(s).includes(topic)) continue;
    const r = row(d, s);
    if (r) out.push(r);
  }
  out.sort(byRow);
  return numberRanks(out);
}
/**
 * The sites the tag filters leave: those carrying every tag in state.active (AND),
 * none carrying an excluded tag. Ranks are recounted among them, as for a single
 * tag. Every redraw (filters, sorting, paging) goes through here.
 */
function scopedRows(all = rowsFor(null)) {
  if (!state.active.length && !state.exclude.length) return all;
  return numberRanks(all.filter((r) => state.active.every((t) => r.topics.includes(t)) && !r.topics.some((t) => state.exclude.includes(t))));
}
/** The key a tag selection sorts and draws under: the tag itself when alone, else the whole selection. */
const activeKey = () => (state.active.length ? state.active.join('、') : null);
const sum = (xs) => xs.reduce((a, b) => a + (b || 0), 0);

// ---------- tooltip ----------
const tip = document.getElementById('tip');
function showTip(html, x, y) {
  tip.innerHTML = html;
  tip.classList.add('show');
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let left = x + 14, top = y - h - 10;
  if (left + w > innerWidth - 8) left = x - w - 14;
  if (top < 8) top = y + 16;
  tip.style.left = `${Math.max(8, left)}px`;
  tip.style.top = `${top}px`;
}
const hideTip = () => tip.classList.remove('show');

// ---------- line chart (sparkline and full) ----------
// points: [{key, value|null}] along calendar months; gaps break the line.
function lineChart(points, { width, height, pad = { t: 8, r: 8, b: 8, l: 8 }, axes = false, fmt = visits, tickFmt = null, band = null, mark = null, yMin0 = true, label = '' }) {
  const vals = points.map((p) => p.value).filter((v) => v != null);
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
  svg.setAttribute('class', axes ? 'chart' : 'spark');
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', label);
  if (!vals.length) return svg;
  let lo = yMin0 ? 0 : Math.min(...vals), hi = Math.max(...vals);
  if (hi === lo) hi = lo + (hi || 1);
  if (axes) {
    // nice upper bound
    const step = niceStep((hi - lo) / 4);
    hi = Math.ceil(hi / step) * step;
    if (!yMin0) lo = Math.floor(lo / step) * step;
  } else hi *= 1.04;
  const iw = width - pad.l - pad.r, ih = height - pad.t - pad.b;
  const x = (i) => pad.l + (points.length === 1 ? iw / 2 : (i / (points.length - 1)) * iw);
  const y = (v) => pad.t + ih - ((v - lo) / (hi - lo)) * ih;
  let html = '';
  if (band) {
    const i0 = points.findIndex((p) => p.key === band[0]), i1 = points.findIndex((p) => p.key === band[1]);
    if (i0 >= 0 && i1 >= 0) {
      const a = Math.min(i0, i1), b = Math.max(i0, i1);
      html += `<rect class="band" x="${x(a) - 3}" y="${pad.t}" width="${x(b) - x(a) + 6}" height="${ih}" rx="3"></rect>`;
    }
  }
  if (axes) {
    const step = niceStep((hi - lo) / 4);
    for (let v = lo; v <= hi + 1e-9; v += step) {
      html += `<line class="${v === lo ? 'baseline' : 'gridline'}" x1="${pad.l}" x2="${width - pad.r}" y1="${y(v)}" y2="${y(v)}"></line>`;
      html += `<text class="tick" x="${pad.l - 6}" y="${y(v) + 4}" text-anchor="end">${(tickFmt || axisNum(step))(v)}</text>`;
    }
    const every = Math.max(1, Math.ceil(points.length / 7));
    points.forEach((p, i) => {
      const last = i === points.length - 1;
      if ((i % every === 0 && (last || points.length - 1 - i >= every / 2 + 0.5)) || last)
        html += `<text class="tick" x="${x(i)}" y="${height - pad.b + 16}" text-anchor="middle">${monthShort(p.key)}</text>`;
    });
  }
  // segments split at gaps; mark gaps with a dotted connector so missing months read as missing
  let seg = [], lastIdx = null;
  const segs = [];
  points.forEach((p, i) => {
    if (p.value == null) { if (seg.length) segs.push(seg); seg = []; return; }
    if (lastIdx != null && i - lastIdx > 1 && axes)
      html += `<line class="gapmark" x1="${x(lastIdx)}" x2="${x(i)}" y1="${y(points[lastIdx].value)}" y2="${y(p.value)}"></line>`;
    seg.push([x(i), y(p.value)]);
    lastIdx = i;
  });
  if (seg.length) segs.push(seg);
  for (const s of segs) {
    if (s.length === 1) html += `<circle class="dot" cx="${s[0][0]}" cy="${s[0][1]}" r="${axes ? 3 : 2}"></circle>`;
    else html += `<path class="line" d="M${s.map((p) => p.map((n) => n.toFixed(1)).join(',')).join('L')}"></path>`;
  }
  const lastI = points.map((p) => p.value != null).lastIndexOf(true);
  if (lastI >= 0 && !axes) html += `<circle class="dot" cx="${x(lastI)}" cy="${y(points[lastI].value)}" r="2.5"></circle>`;
  // the comparison month as a hollow dot (sparklines)
  if (mark) {
    const mi = points.findIndex((p) => p.key === mark);
    if (mi >= 0 && points[mi].value != null) html += `<circle class="from" cx="${x(mi)}" cy="${y(points[mi].value)}" r="2.5"></circle>`;
  }
  html += `<line class="cross" x1="0" x2="0" y1="${pad.t}" y2="${pad.t + ih}" visibility="hidden"></line><circle class="dot hover" r="4" visibility="hidden"></circle>`;
  html += `<rect x="0" y="0" width="${width}" height="${height}" fill="transparent"></rect>`;
  svg.innerHTML = html;
  const cross = svg.querySelector('.cross'), hdot = svg.querySelector('.hover');
  const move = (ev) => {
    const r = svg.getBoundingClientRect();
    const px = ((ev.clientX - r.left) / r.width) * width;
    let i = Math.round(((px - pad.l) / iw) * (points.length - 1));
    i = Math.max(0, Math.min(points.length - 1, i));
    const p = points[i];
    cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.setAttribute('visibility', 'visible');
    if (p.value != null) { hdot.setAttribute('cx', x(i)); hdot.setAttribute('cy', y(p.value)); hdot.setAttribute('visibility', 'visible'); }
    else hdot.setAttribute('visibility', 'hidden');
    showTip(`<b>${monthLabel(p.key)}</b><br>${p.value == null ? '沒有資料' : `${label ? `${esc(label)} ` : ''}${fmt(p.value)}`}${p.extra ? `<br>${p.extra}` : ''}`, ev.clientX, ev.clientY);
  };
  const leave = () => { cross.setAttribute('visibility', 'hidden'); hdot.setAttribute('visibility', 'hidden'); hideTip(); };
  svg.addEventListener('pointermove', move);
  svg.addEventListener('pointerleave', leave);
  return svg;
}
/** Axis numbers with just enough decimals for the step. */
const axisNum = (step) => (v) => v.toLocaleString('zh-TW', { maximumFractionDigits: Math.max(0, -Math.floor(Math.log10(step))), minimumFractionDigits: 0 });
function niceStep(raw) {
  if (raw <= 0) return 1;
  const p = 10 ** Math.floor(Math.log10(raw));
  const f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}

// ---------- header controls ----------
function fillSelects() {
  const months = state.data.months;
  const opts = (sel) => [...months].reverse().map((m) => `<option value="${m}"${m === sel ? ' selected' : ''}>${monthLabel(m)}</option>`).join('');
  document.getElementById('to').innerHTML = opts(state.to);
  // The common comparisons are named in the list itself instead of separate buttons.
  const prevYear = `${Number(state.to.slice(0, 4)) - 1}${state.to.slice(4)}`;
  const idx = months.indexOf(state.to);
  const named = new Map([[months[idx - 1], '上個月'], [months[idx - 3], '3 個月前'], [months[idx - 6], '6 個月前'], [prevYear, '去年同月']]);
  const fromSelect = document.getElementById('from');
  fromSelect.innerHTML = [...months].reverse().filter((m) => m < state.to).map((m) => `<option value="${m}"${m === state.from ? ' selected' : ''}>${monthLabel(m)}${named.has(m) ? `（${named.get(m)}）` : ''}</option>`).join('');
  fromSelect.disabled = state.from === state.to;
  if (state.from === state.to) fromSelect.innerHTML = '<option>無更早月份</option>';
}
function readHash() {
  // The hash wins; ?month=&topic=&source= (links from /tag/ and old URLs) is the fallback.
  const q = new URLSearchParams(location.hash.slice(1));
  const search = new URLSearchParams(location.search);
  if (!q.has('to') && search.has('month')) q.set('to', search.get('month'));
  for (const k of ['topic', 'source']) if (!q.has(k) && search.has(k)) q.set(k, search.get(k));
  const months = state.data.months;
  state.to = months.includes(q.get('to')) ? q.get('to') : months.at(-1);
  const i = months.indexOf(state.to);
  state.from = months.includes(q.get('from')) && q.get('from') < state.to ? q.get('from') : months[i - 1] ?? months[0];
  state.active = [...new Set((q.get('topic') || '').split(',').filter(Boolean))];
  // No exclude in the address means the default (leave out 非台灣); exclude= keeps every site.
  state.exclude = q.has('exclude') ? [...new Set(q.get('exclude').split(',').filter(Boolean))] : [...DEFAULT_EXCLUDE];
  const wanted = SOURCE_OF[q.get('source')] ?? q.get('source');
  state.source = state.data.sources.some((o) => o.source === wanted) ? wanted : null;
  state.hl = q.get('hl');
  state.bumpTop = q.get('top') === '20' ? 20 : 10;
  state.query = q.get('q') || '';
  resetList();
  const sortColumn = COLS.find((c) => c.sort && c.key === q.get('sort'));
  state.sort = { [activeKey() ?? '__all']: sortColumn ? { key: sortColumn.key, dir: q.get('order') === 'asc' ? 1 : q.get('order') === 'desc' ? -1 : sortColumn.dir } : { key: 'rank', dir: 1 } };
  document.getElementById('search').value = state.query;
}
function writeHash() {
  const q = new URLSearchParams({ to: state.to, from: state.from });
  if (state.active.length) q.set('topic', state.active.join(','));
  if (!excludesDefault()) q.set('exclude', state.exclude.join(','));
  if (state.source) q.set('source', state.source);
  if (state.hl) q.set('hl', state.hl);
  if (state.bumpTop !== 10) q.set('top', String(state.bumpTop));
  if (state.query) q.set('q', state.query);
  const sort = currentSort();
  if (sort.key !== 'rank' || sort.dir !== 1) { q.set('sort', sort.key); q.set('order', sort.dir === 1 ? 'asc' : 'desc'); }
  history.replaceState(null, '', `${location.pathname}#${q}`);
}

// ---------- page ----------
/** Filters, sorting and month changes start the list again from its first rows. */
function resetList() {
  state.limit = PAGE_SIZE;
  state.endless = false;
}
/** Sites with traffic this month per source, whatever source is chosen. */
function sourceCounts() {
  const counts = new Map();
  for (const s of Object.values(state.data.sites)) {
    if (s.m[state.to]?.[V] == null) continue;
    for (const src of new Set((s.src || []).map((r) => SOURCE_OF[r] ?? r))) counts.set(src, (counts.get(src) || 0) + 1);
  }
  return counts;
}
// Sources and tags as chip rows like tag.observe.tw/media/; past the first
// CHIPS tags the rest fold behind 「更多」 (tables.js) unless a chosen or excluded tag is there.
// A tag chip goes off → required (several AND together) → leave it out → off; a source chip goes on and off.
const CHIPS = 15;
/** Tags left out when the page opens, until a visitor brings them back. */
const DEFAULT_EXCLUDE = ['非台灣'];
const excludesDefault = () => state.exclude.length === DEFAULT_EXCLUDE.length && DEFAULT_EXCLUDE.every((t) => state.exclude.includes(t));
function renderChips(topics, sources) {
  const host = document.getElementById('chips');
  const wasOpen = host.querySelector('[data-kind="topic"]')?.classList.contains('open');
  const chip = (kind, value, text, { count = null, on = false, excluded = false, hint = '', extra = false } = {}) =>
    `<button type="button" class="chip-filter${extra ? ' extra' : ''}${excluded ? ' excluded' : ''}" data-pick-${kind}="${esc(value)}" aria-pressed="${on}"${hint ? ` title="${hint}"` : ''}>${excluded ? '−' : ''}${esc(text)}${count != null ? ` <span>${count.toLocaleString('zh-TW')}</span>` : ''}</button>`;
  const hidden = topics.length - CHIPS;
  const open = wasOpen || topics.slice(CHIPS).some((t) => state.active.includes(t.value) || state.exclude.includes(t.value));
  const tagHint = (t) => (state.active.includes(t) ? '再按一次改為排除' : state.exclude.includes(t) ? '已排除，再按一次取消' : state.active.length ? '再加上這個標籤（同時符合）' : '只看這個標籤');
  host.innerHTML = `<nav class="chip-row" aria-label="追蹤來源">${chip('source', '', '全部來源', { on: !state.source })}${state.data.sources
    .map((o) => chip('source', o.source, SOURCE_LABEL[o.source] ?? o.source, { count: sources.get(o.source) ?? 0, on: state.source === o.source, hint: state.source === o.source ? '再按一次取消' : '' }))
    .join('')}</nav><nav class="chip-row${open ? ' open' : ''}" data-kind="topic" aria-label="網站標籤">${chip('topic', '', '全部標籤', { on: !state.active.length && !state.exclude.length })}${topics
    .map((t, i) => chip('topic', t.value, t.text, { count: t.count, on: state.active.includes(t.value), excluded: state.exclude.includes(t.value), hint: tagHint(t.value), extra: i >= CHIPS }))
    .join('')}${hidden > 0 ? `<button type="button" class="chip-more" data-chip-more data-more="更多（+${hidden}）" data-less="收合">${open ? '收合' : `更多（+${hidden}）`}</button>` : ''}<span class="chip-note">按一下只看該標籤（可多選，需同時符合），再按一下排除，第三下取消</span></nav>`;
}
function render() {
  fillSelects();
  const all = rowsFor(null);
  const counts = new Map();

<span class="seg" role="group" aria-label="顯示幾名"><button type="button" data-top="10" aria-pressed="${N === 10}">前 10</button><button type="button" data-top="20" aria-pressed="${N === 20}">前 20</button></span></div>`;

  const site = new URLSearchParams(location.hash.slice(1)).get('site');
  if (site) location.replace(siteHref(site));
  return !!site;
};
addEventListener('hashchange', () => {
  if (!state.data?.months.length || leaveForSite()) return;
  readHash(); render();
});
async function loadData() {
  try {
    const response = await fetch('/api/v1/history');
    if (!response.ok) throw Error('無法取得資料');
    const data = await response.json();
    if (!Array.isArray(data.months)) throw Error('資料格式不正確');
    state.data = data;
    if (!data.months.length) {
      document.getElementById('result-count').textContent = '尚無月份資料';
      document.getElementById('sections').innerHTML = '<div class="empty"><strong>還沒有流量資料</strong><p>資料更新後，網站排行會顯示在這裡。</p><a href="/status/">查看更新狀態</a></div>';
      document.getElementById('to').innerHTML = '<option>尚無資料</option>';
    } else {
      if (leaveForSite()) return;
      readHash(); render();
      document.querySelectorAll('.report-main input, .report-main select').forEach((el) => { el.disabled = false; });
      if (state.from === state.to) document.getElementById('from').disabled = true;
    }
    document.getElementById('overview').setAttribute('aria-busy', 'false');
    document.getElementById('sections').setAttribute('aria-busy', 'false');
    document.getElementById('generated').textContent = `資料更新 ${new Date(data.generatedAt).toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', hour12: false, dateStyle: 'short', timeStyle: 'short' })} · 台北時間`;
  } catch {
    document.getElementById('overview').setAttribute('aria-busy', 'false');
    document.getElementById('sections').setAttribute('aria-busy', 'false');
    document.getElementById('result-count').textContent = '資料暫時無法載入';
    document.getElementById('sections').innerHTML = '<div class="empty"><strong>暫時無法取得流量資料</strong><p>請稍後重試，或先查看<a href="/table/">完整數據</a>。</p><button id="retry" type="button">重新載入</button></div>';
    document.getElementById('retry').addEventListener('click', () => { document.getElementById('retry').disabled = true; loadData(); });
  }
}
loadData();
</script>
</body>
